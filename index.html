<style>
:root{--p:#6557ff;--p2:#9b76ff;--cyan:#39c6ff;--pink:#ff6aa9;--orange:#ff9f43;--green:#24c98a;--red:#ef5b68;--ink:#182038;--muted:#6f7890;--line:#e4e8f2;--bg:#f6f7ff;--card:#fff;--shadow:0 18px 45px #29345d17}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,#e8e5ff 0,transparent 25%),radial-gradient(circle at 95% 10%,#e4f8ff 0,transparent 23%),linear-gradient(180deg,#fbfbff,#f3f5fb);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:40;background:#ffffffea;backdrop-filter:blur(14px);border-bottom:1px solid #e9ecf5;display:flex;justify-content:space-between;align-items:center;padding:12px max(16px,calc((100vw - 1160px)/2))}.brand{border:0;background:none;font-size:22px;font-weight:1000;color:var(--ink);letter-spacing:-.7px}.brand b{color:var(--p)}.stats{display:flex;gap:8px;align-items:center}.chip{display:inline-flex;align-items:center;gap:5px;background:#f0efff;color:var(--p);padding:8px 11px;border-radius:999px;font-size:13px;font-weight:900}.chip.dark{background:#1d2540;color:#fff}.wrap{width:min(1160px,calc(100% - 28px));margin:auto;padding:34px 0 70px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding:38px 0 44px}.eyebrow{font-size:12px;font-weight:1000;letter-spacing:1px;color:var(--p);text-transform:uppercase}.hero h1{font-size:clamp(46px,6vw,78px);line-height:.98;letter-spacing:-4px;margin:12px 0 18px}.hero h1 span{background:linear-gradient(90deg,var(--p),#a23fff,var(--cyan));-webkit-background-clip:text;color:transparent}.hero p{font-size:18px;line-height:1.65;color:var(--muted);max-width:660px}.heroArt{min-height:350px;border-radius:36px;background:linear-gradient(135deg,#5145e6,#836cff 55%,#41c6ff);position:relative;overflow:hidden;box-shadow:0 24px 60px #5e56ea33;display:grid;place-items:center}.orb{position:absolute;border-radius:50%;filter:blur(1px);opacity:.28;background:#fff}.orb.one{width:180px;height:180px;left:-40px;top:-35px}.orb.two{width:120px;height:120px;right:20px;bottom:20px}.heroCard{width:240px;height:240px;border-radius:34px;background:#fff;display:grid;place-items:center;text-align:center;transform:rotate(5deg);box-shadow:0 22px 42px #1a1d4725;animation:float 2.8s ease-in-out infinite alternate}.heroCard .e{font-size:94px}.heroCard b{font-size:26px;color:var(--p)}@keyframes float{to{transform:rotate(2deg) translateY(-10px)}}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:950;transition:.18s}.btn:hover{transform:translateY(-2px)}.primary{background:linear-gradient(135deg,var(--p),#7c69ff);color:#fff;box-shadow:0 10px 22px #6557ff29}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.darkBtn{background:#1b243d;color:#fff}.danger{background:#fff0f2;color:var(--red);border:1px solid #ffd4da}.small{padding:9px 12px;font-size:13px}.sectionTitle{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:14px 0}.sectionTitle h2{font-size:30px;margin:0;letter-spacing:-1px}.sectionTitle p{margin:0;color:var(--muted)}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.game{--c1:#6b5cff;--c2:#8d7bff;position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:#fff;border-radius:24px;padding:21px;min-height:188px;box-shadow:0 10px 27px #26315d0d;transition:.2s}.game:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--c1),var(--c2))}.game:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:#d7d9ff}.game .i{width:48px;height:48px;border-radius:15px;background:#f1f1ff;display:grid;place-items:center;font-size:28px}.game h3{font-size:20px;margin:18px 0 7px}.game p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.tag{position:absolute;right:15px;top:15px;background:#171f38;color:#fff;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:1000;letter-spacing:.5px}.game.new .tag{background:linear-gradient(90deg,var(--pink),#ff8f68)}.sectionHead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}.back{border:0;background:transparent;color:var(--p);font-weight:950;padding:0}.sectionHead h1{font-size:clamp(34px,4vw,50px);letter-spacing:-2px;margin:7px 0 8px}.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--shadow)}.progress{height:10px;background:#eef0f6;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--cyan));transition:.25s}.levelGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.level{border:1px solid var(--line);background:#fff;border-radius:23px;padding:22px;text-align:left;min-height:210px;box-shadow:0 10px 25px #27305a0b}.level:hover{transform:translateY(-3px)}.level.active{border:2px solid var(--p);background:linear-gradient(180deg,#f5f3ff,#fff)}.level .num{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#eceaff,#e9f6ff);color:var(--p);display:grid;place-items:center;font-weight:1000}.level h3{font-size:22px;margin:18px 0 7px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}.toolbar input,.toolbar select,.answerInput{padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}.toolbar input:focus,.answerInput:focus{border-color:#a9a2ff;box-shadow:0 0 0 4px #6557ff12}.teacherButtons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.verbGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-height:58vh;overflow:auto;padding-right:4px}.verbItem{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;display:flex;gap:9px;align-items:flex-start}.verbItem.checked{background:#f1f0ff;border-color:#aaa5ff}.verbItem strong{display:block;text-transform:uppercase;font-size:13px}.verbItem small{display:block;color:var(--muted);margin-top:3px}.flash{display:grid;grid-template-columns:.85fr 1.15fr;gap:24px;align-items:center}.picture{min-height:340px;border-radius:25px;background:linear-gradient(135deg,#ecebff,#e8f8ff 50%,#fff3dd);display:grid;place-items:center;text-align:center;position:relative;overflow:hidden}.picture .big{font-size:115px;filter:drop-shadow(0 8px 10px #00000012)}.word h2{font-size:58px;margin:4px 0;text-transform:uppercase}.past{font-size:38px;color:var(--p);font-weight:1000;text-transform:uppercase}.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.forms div{background:#f7f8fc;padding:12px;border-radius:12px}.quiz{width:min(760px,100%);margin:auto}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.option{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:950;text-transform:uppercase}.option:hover{border-color:#b9b4ff}.option.ok{background:#e8f8f1;border-color:#9bdec1;color:var(--green)}.option.bad{background:#fff0f2;border-color:#f0b3ba;color:var(--red)}.feedback{min-height:28px;margin-top:13px;font-weight:950}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mem{height:100px;border:1px solid #726cff;border-radius:15px;background:linear-gradient(145deg,#5549e9,#8b78ff);color:#fff;font-weight:950;box-shadow:0 8px 18px #6457ff20}.mem.open,.mem.done{background:#fff;color:var(--p);border-color:var(--line)}.mem.done{background:#e8f8f1;color:var(--green);border-color:#9bdec1}.robot{display:grid;grid-template-columns:310px 1fr;gap:22px}.robotBox{background:linear-gradient(145deg,#171f38,#39466a);color:#fff;border-radius:24px;padding:25px;text-align:center;position:relative;overflow:hidden}.robotFace{font-size:120px}.energy{height:14px;background:#ffffff22;border-radius:999px;overflow:hidden}.energy span{display:block;height:100%;background:linear-gradient(90deg,#ff5b6f,#ffd166,#2fd69a);width:100%;transition:.3s}.lives{display:flex;gap:7px;justify-content:center;font-size:28px;margin:10px 0}.hangWord{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px 0}.hangLetter{width:42px;height:52px;border-bottom:4px solid var(--ink);display:grid;place-items:center;font-size:26px;font-weight:1000}.keyboard{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.key{padding:9px 4px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:950}.key:disabled{opacity:.5}.matchBoard{display:grid;grid-template-columns:1fr 60px 1fr;gap:16px;align-items:center}.matchCol{display:grid;gap:8px}.matchBtn{padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:950;text-transform:uppercase}.matchBtn.sel{background:#eeedff;color:var(--p);border-color:#aaa5ff}.matchBtn.done{background:#e8f8f1;color:var(--green);border-color:#9bdec1}.drawGrid{display:grid;grid-template-columns:290px 1fr;gap:18px}.drawPrompt{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.drawPrompt h2{font-size:48px;text-transform:uppercase;margin:8px 0}.canvasWrap{background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px}.canvasWrap canvas{width:100%;height:auto;background:#fff;border:2px dashed #d9dee8;border-radius:16px;touch-action:none}.canvasTools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.finalBox{width:min(780px,100%);margin:auto}.finalBig{text-align:center;font-size:54px;font-weight:1000;text-transform:uppercase;margin:16px}.result{text-align:center;padding:20px}.result .score{font-size:72px;color:var(--p);font-weight:1000}.review{display:grid;gap:7px;margin:20px auto;max-width:560px}.review div{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:11px;padding:9px 12px}.ladder{display:grid;gap:10px}.ladderStep{display:grid;grid-template-columns:45px 1fr;gap:12px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fafbff}.ladderStep .n{width:38px;height:38px;border-radius:12px;background:#eeedff;color:var(--p);display:grid;place-items:center;font-weight:1000}.ladderStep.done{background:#ecfaf4;border-color:#9bdec1}.speedBox{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center}.timerRing{width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--p) var(--deg,360deg),#eceef5 0);display:grid;place-items:center;position:relative}.timerRing:before{content:"";width:135px;height:135px;border-radius:50%;background:#fff;position:absolute}.timerRing b{position:relative;font-size:48px}.speedPrompt{text-align:center;padding:20px}.speedPrompt .emoji{font-size:90px}.combo{font-size:14px;font-weight:950;color:var(--pink)}.loading{text-align:center;padding:100px 20px}.loading .spin{font-size:60px;animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.12)}}@media(max-width:920px){.hero{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,1fr)}.levelGrid{grid-template-columns:repeat(2,1fr)}.verbGrid{grid-template-columns:repeat(2,1fr)}.robot,.drawGrid,.speedBox{grid-template-columns:1fr}.flash{grid-template-columns:1fr}.matchBoard{grid-template-columns:1fr}.matchArrow{transform:rotate(90deg);text-align:center}.memory{grid-template-columns:repeat(3,1fr)}.timerRing{margin:auto}}@media(max-width:560px){.chip.mode{display:none}.games,.levelGrid,.verbGrid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.options{grid-template-columns:1fr}.memory{grid-template-columns:repeat(2,1fr)}.keyboard{grid-template-columns:repeat(7,1fr)}.heroArt{min-height:250px}.heroCard{width:185px;height:185px}.heroCard .e{font-size:72px}.picture{min-height:250px}.picture .big{font-size:84px}.word h2{font-size:44px}.forms{grid-template-columns:1fr}.robotFace{font-size:90px}}

<body>
<header class="top"><button class="brand" onclick="home()"><b>Verb</b> Quest</button><div class="stats"><span class="chip mode" id="modeChip">Loading…</span><span class="chip">⭐ <span id="score">0</span></span><span class="chip dark">🔥 <span id="streak">0</span></span></div></header>
<main id="app" class="wrap"><div class="loading"><div class="spin">🎮</div><h2>Loading Verb Quest…</h2><p class="muted">Preparing 200 verbs and the game zone.</p></div></main>
<script>
let V=[];const app=document.querySelector('#app');const $=s=>document.querySelector(s);const DATA_URL='https://raw.githubusercontent.com/mongayesluina/verb-quest/data-snapshot/index.html';const saved=(()=>{try{return JSON.parse(localStorage.vqFull||'{}')}catch{return{}}})();let state={score:+(saved.score||0),streak:+(saved.streak||0),level:saved.level??1,mode:saved.mode||'level',custom:Array.isArray(saved.custom)?saved.custom:[],sound:saved.sound!==false};const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const sample=(a,n)=>shuffle(a).slice(0,Math.min(n,a.length));const primary=v=>v[1].split('/')[0].trim();const pastForms=v=>v[1].split('/').map(x=>x.trim().toLowerCase());const enc=s=>encodeURIComponent(String(s));function save(){localStorage.vqFull=JSON.stringify(state);topbar()}function topbar(){if(!V.length)return;$('#score').textContent=state.score;$('#streak').textContent=state.streak;$('#modeChip').textContent=state.mode==='custom'?`Teacher • ${state.custom.length}`:state.level===0?`All • ${V.length}`:`Level ${state.level} • ${pool().length}`}function pool(){if(state.mode==='custom'&&state.custom.length>=4){let s=new Set(state.custom);return V.filter((v,i)=>s.has(i))}return state.level===0?V:V.filter(v=>v[4]===state.level)}function add(n){state.score+=n;state.streak++;save()}function miss(){state.streak=0;save()}function speak(t){if(state.sound&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}}function icon(v){return v[6]||'🎯'}function typ(v){return v[5]==='i'?'Irregular':'Regular'}function head(title,sub=''){return `<div class="sectionHead"><div><button class="back" onclick="home()">← Home</button><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div></div>`}async function load(){try{let t=await fetch(DATA_URL+'?v=2').then(r=>{if(!r.ok)throw Error(r.status);return r.text()});let m=t.match(/const V=(\[[\s\S]*?\]);let score=/);if(!m)throw Error('Verb data not found');V=Function('"use strict";return ('+m[1]+')')();topbar();home()}catch(e){app.innerHTML=`<div class="loading"><div class="spin">⚠️</div><h2>Could not load the verb list</h2><p class="muted">Check your Internet connection and reload the page.</p><button class="btn primary" onclick="location.reload()">Reload</button></div>`}}
function home(){let cards=[['flash','🎴','Flashcards','Study all four forms and listen to pronunciation.','#6557ff','#9678ff',''],['quiz','🧩','Past Challenge','Mixed questions: past, base, meaning and typing.','#ff6aa9','#ff9f6a','HARDER'],['memory','🧠','Memory Pro','More pairs and less room for guessing.','#2bb7a1','#5bd8b2','HARDER'],['robot','🤖','Save the Robot','Only two mistakes. Miss twice and the robot powers down.','#ff8357','#ff4f76','2 LIVES'],['matchGame','🔗','Match Rush','Match eight verb pairs correctly.','#3f9cff','#63d1ff','8 PAIRS'],['drawGame','🎨','Draw & Spell','Draw the action, then type the past form to score.','#a75cff','#ec6fe7','HARDER'],['ladderGame','🪜','Verb Ladder','Climb base → past → participle → meaning.','#19b87c','#7bd36d','NEW'],['speedGame','⚡','Speed Run','45 seconds. Type as many past forms as you can.','#ffb21d','#ff6a43','NEW'],['finalGame','🏆','Final Challenge','15 mixed questions with a complete review.','#232d52','#6557ff','15 Q']];app.innerHTML=`<section class="hero"><div><div class="eyebrow">200 verbs • 9 games • classroom ready</div><h1>Master the past through <span>challenge and play.</span></h1><p>Practice regular and irregular verbs with memory, spelling, matching, speed, listening and mixed challenges. Choose a level or create your own classroom set.</p><div class="row"><button class="btn primary" onclick="levels()">Choose a level</button><button class="btn secondary" onclick="teacher()">Teacher Mode</button><button class="btn darkBtn" onclick="finalGame()">🏆 Final Challenge</button></div></div><div class="heroArt"><span class="orb one"></span><span class="orb two"></span><div class="heroCard"><div><div class="e">🏃</div><b>RUN → RAN</b><div class="muted" style="margin-top:5px">ready to play?</div></div></div></div></section><div class="sectionTitle"><div><h2>Game zone</h2><p>Games now become more demanding as you progress.</p></div><span class="chip">9 GAMES</span></div><section class="games">${cards.map(c=>`<button class="game ${c[6]==='NEW'?'new':''}" style="--c1:${c[4]};--c2:${c[5]}" onclick="${c[0]}()"><div class="i">${c[1]}</div>${c[6]?`<span class="tag">${c[6]}</span>`:''}<h3>${c[2]}</h3><p>${c[3]}</p></button>`).join('')}</section>`;topbar()}
function levels(){let meta=[[1,'Essentials','70 high-frequency verbs. Best place to begin.'],[2,'Everyday English','70 verbs for stories and conversation.'],[3,'Challenge','60 less predictable verbs and spelling forms.'],[0,'All 200','Mix every regular and irregular verb.']];app.innerHTML=head('Choose a level','The selected level controls every game.')+`<div class="levelGrid">${meta.map(m=>`<button class="level ${state.mode==='level'&&state.level===m[0]?'active':''}" onclick="setLevel(${m[0]})"><span class="num">${m[0]||'∞'}</span><h3>${m[1]}</h3><p class="muted">${m[2]}</p><b>${m[0]===0?200:V.filter(v=>v[4]===m[0]).length} verbs →</b></button>`).join('')}</div>`}function setLevel(n){state.level=n;state.mode='level';save();home()}let teacherSet=new Set();function teacher(){teacherSet=new Set(state.mode==='custom'?state.custom:pool().map(v=>V.indexOf(v)));app.innerHTML=head('Teacher Mode','Select at least four verbs. Every game will use the same set.')+`<div class="toolbar"><input id="search" placeholder="Search: go, went, ir..." oninput="teacherList()"><select id="lev" onchange="teacherList()"><option value="0">All levels</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option></select><select id="tp" onchange="teacherList()"><option value="a">All types</option><option value="i">Irregular</option><option value="r">Regular</option></select></div><div class="teacherButtons"><button class="btn secondary small" onclick="pickType('i')">All irregular</button><button class="btn secondary small" onclick="pickType('r')">All regular</button><button class="btn secondary small" onclick="pickAll()">All 200</button><button class="btn danger small" onclick="teacherSet.clear();teacherList()">Clear</button><button class="btn primary small" onclick="useTeacher()">Use selected (<span id="selCount">0</span>)</button></div><div class="verbGrid" id="verbGrid"></div>`;teacherList()}function teacherList(){let q=($('#search')?.value||'').toLowerCase(),l=+($('#lev')?.value||0),t=$('#tp')?.value||'a';let out=[];V.forEach((v,i)=>{if((!q||[v[0],v[1],v[2],v[3]].join(' ').toLowerCase().includes(q))&&(!l||v[4]===l)&&(t==='a'||v[5]===t))out.push([v,i])});$('#verbGrid').innerHTML=out.map(([v,i])=>`<label class="verbItem ${teacherSet.has(i)?'checked':''}"><input type="checkbox" ${teacherSet.has(i)?'checked':''} onchange="toggleVerb(${i},this.checked)"><span><strong>${v[0]} → ${v[1]}</strong><small>${v[3]} • ${typ(v)} • L${v[4]}</small></span></label>`).join('');$('#selCount').textContent=teacherSet.size}function toggleVerb(i,on){on?teacherSet.add(i):teacherSet.delete(i);teacherList()}function pickType(t){teacherSet=new Set(V.map((v,i)=>v[5]===t?i:null).filter(i=>i!==null));teacherList()}function pickAll(){teacherSet=new Set(V.map((_,i)=>i));teacherList()}function useTeacher(){if(teacherSet.size<4)return alert('Select at least 4 verbs.');state.custom=[...teacherSet];state.mode='custom';save();home()}
let fi=0;function flash(){let a=pool();fi%=a.length;let v=a[fi];app.innerHTML=head('Flashcards','Study all four forms, then say them aloud.')+`<div class="panel flash"><div class="picture"><div><div class="big">${icon(v)}</div><span class="chip">${typ(v)} • Level ${v[4]}</span></div></div><div class="word"><div class="muted">BASE FORM</div><h2>${v[0]}</h2><p class="muted">${v[3]}</p><div class="past">${v[1]}</div><div class="forms"><div><small class="muted">PAST PARTICIPLE</small><br><b>${v[2]}</b></div><div><small class="muted">TYPE</small><br><b>${typ(v)}</b></div></div><div class="row"><button class="btn primary" onclick="speak('${v[0].replace(/'/g,"\\'")}');setTimeout(()=>speak('${primary(v).replace(/'/g,"\\'")}'),650)">🔊 Base + Past</button><button class="btn secondary" onclick="fi=(fi-1+pool().length)%pool().length;flash()">← Previous</button><button class="btn secondary" onclick="fi=(fi+1)%pool().length;flash()">Next →</button></div></div></div>`}
function choiceOptions(opts,ans,upper=true){return `<div class="options">${opts.map(o=>`<button class="option" style="${upper?'':'text-transform:none'}" onclick="checkChoice(this,decodeURIComponent('${enc(o)}'),decodeURIComponent('${enc(ans)}'))">${o}</button>`).join('')}</div>`}function choiceBlock(v,title,opts,ans){return `<div class="picture"><div><div class="big">${icon(v)}</div><h2>${v[0].toUpperCase()}</h2><span class="muted">${v[3]}</span></div></div><h2>${title}</h2>${choiceOptions(opts,ans)}`}
function quiz(){let round=Array.from({length:12},()=>sample(pool(),1)[0]),i=0,good=0,bad=[];function next(){if(i>=round.length){let pct=Math.round(good/round.length*100);app.innerHTML=head('Past Challenge')+`<div class="panel result"><div style="font-size:72px">${pct>=85?'🏆':pct>=65?'⭐':'📚'}</div><div class="score">${good}/12</div><h2>${pct}% accuracy</h2><p class="muted">This round mixed four different question types.</p>${bad.length?`<div class="review">${bad.map(x=>`<div><span>${x[0].toUpperCase()}</span><b>${x[1].toUpperCase()}</b></div>`).join('')}</div>`:''}<button class="btn primary" onclick="quiz()">Play another round</button></div>`;return}let v=round[i],type=i%4,body='';if(type===0){let ans=primary(v),opts=shuffle([ans,...sample(V.filter(x=>primary(x)!==ans),3).map(primary)]);body=choiceBlock(v,`Choose the past simple of ${v[0].toUpperCase()}`,opts,ans)}else if(type===1){let ans=v[0],opts=shuffle([ans,...sample(V.filter(x=>x[0]!==ans),3).map(x=>x[0])]);body=`<div class="finalBig">${primary(v)}</div><h2>Which base form matches this past?</h2>`+choiceOptions(opts,ans)}else if(type===2){let ans=v[3],opts=shuffle([ans,...sample(V.filter(x=>x[3]!==ans),3).map(x=>x[3])]);body=`<div class="picture"><div><div class="big">${icon(v)}</div><div class="finalBig" style="font-size:40px">${v[0]}</div></div></div><h2>Choose the Spanish meaning:</h2>`+choiceOptions(opts,ans,false)}else{body=`<div class="picture"><div><div class="big">${icon(v)}</div><h2>${v[0].toUpperCase()}</h2><p class="muted">${v[3]}</p></div></div><h2>Type the past simple:</h2><div class="row"><input id="typedQuiz" class="answerInput" autocomplete="off" placeholder="Type the past form"><button class="btn primary" onclick="checkTypedQuiz()">Check</button></div>`}app.innerHTML=head('Past Challenge',`Question ${i+1} / 12 • ${good} correct`)+`<div class="panel quiz"><div class="progress"><span style="width:${i/12*100}%"></span></div><div style="height:15px"></div>${body}<div id="feed" class="feedback"></div></div>`;window.qz={v,type,good:()=>good++,bad:()=>bad.push(v),next:()=>{i++;next()}};if(type===3)setTimeout(()=>$('#typedQuiz')?.focus(),50)}next()}function checkChoice(b,o,a){document.querySelectorAll('.option').forEach(x=>x.disabled=true);if(o===a){b.classList.add('ok');$('#feed').textContent='Correct! +10 XP';$('#feed').style.color='var(--green)';window.qz.good();add(10)}else{b.classList.add('bad');[...document.querySelectorAll('.option')].find(x=>x.textContent===a)?.classList.add('ok');$('#feed').textContent='Correct answer: '+a;$('#feed').style.color='var(--red)';window.qz.bad();miss()}setTimeout(window.qz.next,900)}function checkTypedQuiz(){let v=window.qz.v,val=$('#typedQuiz').value.trim().toLowerCase(),ok=pastForms(v).includes(val);$('#typedQuiz').disabled=true;if(ok){window.qz.good();add(12);$('#feed').textContent='Correct! +12 XP';$('#feed').style.color='var(--green)'}else{window.qz.bad();miss();$('#feed').textContent='Correct answer: '+v[1];$('#feed').style.color='var(--red)'}setTimeout(window.qz.next,950)}
function memory(){let pairCount=Math.min(state.level===3||state.level===0?10:8,pool().length),vs=sample(pool(),pairCount),cards=shuffle(vs.flatMap((v,i)=>[{id:i,t:v[0]},{id:i,t:primary(v)}])),open=[],done=0,moves=0;app.innerHTML=head('Memory Pro',`Match ${pairCount} base/past pairs. More cards, fewer lucky guesses.`)+`<div class="panel"><div class="row"><span class="chip">Moves <b id="moves">0</b></span><span class="chip">Pairs <b id="pairs">0</b>/${pairCount}</span></div><div class="memory" style="margin-top:16px">${cards.map(c=>`<button class="mem" data-id="${c.id}" data-t="${c.t}" onclick="memOpen(this)">?</button>`).join('')}</div><div id="memMsg" class="feedback"></div></div>`;window.memState={open,done,moves,pairCount}}function memOpen(b){let s=window.memState;if(b.classList.contains('open')||b.classList.contains('done')||s.open.length===2)return;b.classList.add('open');b.textContent=b.dataset.t;s.open.push(b);if(s.open.length===2){s.moves++;$('#moves').textContent=s.moves;let[a,c]=s.open;if(a.dataset.id===c.dataset.id){a.classList.add('done');c.classList.add('done');s.done++;$('#pairs').textContent=s.done;add(7);s.open=[];if(s.done===s.pairCount)$('#memMsg').innerHTML='<span style="color:var(--green)">Excellent! All pairs matched.</span>'}else setTimeout(()=>{a.classList.remove('open');c.classList.remove('open');a.textContent=c.textContent='?';s.open=[]},620)}}
function robot(){let v=sample(pool(),1)[0],word=primary(v).toUpperCase(),letters=new Set(),errors=0,max=2;app.innerHTML=head('Save the Robot','You only have TWO wrong attempts. The second mistake ends the round.')+`<div class="panel robot"><div class="robotBox"><div class="robotFace" id="face">🤖</div><div class="lives" id="lives">❤️ ❤️</div><div class="energy"><span id="energy"></span></div><p><b>2 ATTEMPTS ONLY</b></p></div><div><p class="muted">Spell the past simple of <b style="color:var(--ink);font-size:28px">${v[0].toUpperCase()}</b></p><p>${v[3]}</p><div class="hangWord" id="hang"></div><div class="keyboard" id="keys"></div><div id="robotMsg" class="feedback"></div><button id="nextRobot" class="btn primary" style="display:none" onclick="robot()">Next verb</button></div></div>`;window.rob={v,word,letters,errors,max,over:false};drawRobot();$('#keys').innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(k=>`<button class="key" onclick="guessLetter(this,'${k}')">${k}</button>`).join('')}function drawRobot(){let s=window.rob;$('#hang').innerHTML=s.word.split('').map(ch=>ch===' '?'<span style="width:20px"></span>':`<span class="hangLetter">${s.letters.has(ch)?ch:''}</span>`).join('');$('#energy').style.width=((s.max-s.errors)/s.max*100)+'%';$('#lives').textContent=s.errors===0?'❤️ ❤️':s.errors===1?'❤️ 🖤':'🖤 🖤';if([...s.word].filter(ch=>/[A-Z]/.test(ch)).every(ch=>s.letters.has(ch))&&!s.over){s.over=true;$('#robotMsg').textContent=`Saved! ${s.v[0].toUpperCase()} → ${primary(s.v).toUpperCase()}`;$('#robotMsg').style.color='var(--green)';$('#nextRobot').style.display='inline-block';document.querySelectorAll('.key').forEach(k=>k.disabled=true);add(15);speak(primary(s.v))}else if(s.errors>=s.max&&!s.over){s.over=true;$('#face').textContent='🤖💤';$('#robotMsg').textContent='Power lost! Answer: '+primary(s.v).toUpperCase();$('#robotMsg').style.color='var(--red)';$('#nextRobot').style.display='inline-block';document.querySelectorAll('.key').forEach(k=>k.disabled=true);miss()}}function guessLetter(b,l){let s=window.rob;if(s.over)return;b.disabled=true;s.letters.add(l);if(!s.word.includes(l))s.errors++;drawRobot()}
function matchGame(){let count=Math.min(8,pool().length),vs=sample(pool(),count),bases=shuffle(vs),pasts=shuffle(vs),a=null,b=null,done=0,mistakes=0;app.innerHTML=head('Match Rush','Match eight verbs. Three wrong pairings reset your streak.')+`<div class="panel"><div class="row"><span class="chip">Matched <b id="matched">0</b>/${count}</span><span class="chip">Wrong <b id="wrongMatch">0</b>/3</span></div><div class="matchBoard" style="margin-top:16px"><div class="matchCol" id="baseCol">${bases.map(v=>`<button class="matchBtn" data-id="${V.indexOf(v)}" onclick="matchPick(this,'a')">${v[0]}</button>`).join('')}</div><div class="matchArrow">↔</div><div class="matchCol" id="pastCol">${pasts.map(v=>`<button class="matchBtn" data-id="${V.indexOf(v)}" onclick="matchPick(this,'b')">${primary(v)}</button>`).join('')}</div></div><div id="matchMsg" class="feedback"></div></div>`;window.mat={a,b,done,mistakes,count}}function matchPick(el,side){if(el.classList.contains('done'))return;let s=window.mat,root=side==='a'?'#baseCol':'#pastCol';document.querySelectorAll(root+' .sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');s[side]=el;if(s.a&&s.b){if(s.a.dataset.id===s.b.dataset.id){s.a.classList.add('done');s.b.classList.add('done');s.a.classList.remove('sel');s.b.classList.remove('sel');s.done++;$('#matched').textContent=s.done;$('#matchMsg').textContent=`Correct! ${s.done}/${s.count}`;$('#matchMsg').style.color='var(--green)';add(8);s.a=s.b=null;if(s.done===s.count)$('#matchMsg').textContent='Excellent! All eight pairs matched.'}else{s.mistakes++;$('#wrongMatch').textContent=s.mistakes;$('#matchMsg').textContent=s.mistakes>=3?'Three misses — streak reset.':'Wrong pair. Try again.';$('#matchMsg').style.color='var(--red)';if(s.mistakes===3)miss();setTimeout(()=>{s.a?.classList.remove('sel');s.b?.classList.remove('sel');s.a=s.b=null},430)}}}
function drawGame(){let v=sample(pool(),1)[0];app.innerHTML=head('Draw & Spell','Draw the action, then TYPE the past form. No free reveal.')+`<div class="drawGrid"><div class="drawPrompt"><span class="chip">DRAW THIS</span><h2>${v[0]}</h2><p class="muted">${v[3]}</p><input id="drawAnswer" class="answerInput" style="width:100%;margin:12px 0" placeholder="Type the past"><button class="btn primary" style="width:100%" onclick="checkDraw()">Check answer</button><div id="drawAns" class="feedback"></div><button id="drawNext" class="btn secondary" style="display:none;width:100%;margin-top:8px" onclick="drawGame()">New verb</button></div><div class="canvasWrap"><canvas id="canvas" width="1000" height="620"></canvas><div class="canvasTools"><label>Brush <input id="size" type="range" min="2" max="24" value="6"></label><button class="btn secondary small" onclick="eraser=!eraser">Eraser</button><button class="btn secondary small" onclick="clearCanvas()">Clear</button></div></div></div>`;window.drawVerb=v;setupCanvas();setTimeout(()=>$('#drawAnswer')?.focus(),50)}let ctx,drawing=false,eraser=false;function setupCanvas(){let c=$('#canvas');ctx=c.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';let pos=e=>{let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};let start=e=>{drawing=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()},move=e=>{if(!drawing)return;let p=pos(e);ctx.strokeStyle=eraser?'#fff':'#20293a';ctx.lineWidth=eraser?35:+$('#size').value;ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()},stop=()=>drawing=false;c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);window.addEventListener('pointerup',stop)}function clearCanvas(){ctx.clearRect(0,0,1000,620)}function checkDraw(){let v=window.drawVerb,val=$('#drawAnswer').value.trim().toLowerCase(),ok=pastForms(v).includes(val);$('#drawAnswer').disabled=true;$('#drawNext').style.display='block';if(ok){$('#drawAns').textContent='Correct! '+v[0].toUpperCase()+' → '+v[1].toUpperCase()+' +12 XP';$('#drawAns').style.color='var(--green)';add(12);speak(primary(v))}else{$('#drawAns').textContent='Answer: '+v[1].toUpperCase();$('#drawAns').style.color='var(--red)';miss()}}
function ladderGame(){let v=sample(pool(),1)[0],step=0,score=0;function render(){let labels=['PAST SIMPLE','PAST PARTICIPLE','SPANISH MEANING'],answers=[primary(v),v[2].split('/')[0].trim(),v[3]];if(step>=3){app.innerHTML=head('Verb Ladder')+`<div class="panel result"><div style="font-size:70px">🪜✨</div><div class="score">${score}/3</div><h2>${v[0].toUpperCase()} → ${v[1].toUpperCase()} → ${v[2].toUpperCase()}</h2><p>${v[3]}</p><button class="btn primary" onclick="ladderGame()">Climb another ladder</button></div>`;return}let ans=answers[step],choices=step===0?shuffle([ans,...sample(V.filter(x=>primary(x)!==ans),3).map(primary)]):step===1?shuffle([ans,...sample(V.filter(x=>x[2].split('/')[0].trim()!==ans),3).map(x=>x[2].split('/')[0].trim())]):shuffle([ans,...sample(V.filter(x=>x[3]!==ans),3).map(x=>x[3])]);app.innerHTML=head('Verb Ladder','Climb all three steps without falling.')+`<div class="panel finalBox"><div class="ladder"><div class="ladderStep done"><span class="n">✓</span><div><small class="muted">BASE FORM</small><br><b>${v[0].toUpperCase()}</b></div></div>${[0,1,2].map(n=>`<div class="ladderStep ${n<step?'done':''}"><span class="n">${n<step?'✓':n+1}</span><div><small class="muted">${['PAST SIMPLE','PAST PARTICIPLE','MEANING'][n]}</small><br><b>${n<step?answers[n].toUpperCase():'???'}</b></div></div>`).join('')}</div><h2 style="margin-top:20px">Step ${step+1}: choose the ${labels[step].toLowerCase()}</h2><div class="options">${choices.map(o=>`<button class="option" style="${step===2?'text-transform:none':''}" onclick="ladderPick(this,decodeURIComponent('${enc(o)}'),decodeURIComponent('${enc(ans)}'))">${o}</button>`).join('')}</div><div id="ladFeed" class="feedback"></div></div>`;window.lad={ok:()=>{score++;step++;render()},bad:()=>{step=0;score=0;setTimeout(render,800)}}}render()}function ladderPick(b,o,a){document.querySelectorAll('.option').forEach(x=>x.disabled=true);if(o===a){b.classList.add('ok');$('#ladFeed').textContent='Correct! Climb up.';$('#ladFeed').style.color='var(--green)';add(8);setTimeout(window.lad.ok,650)}else{b.classList.add('bad');$('#ladFeed').textContent='Wrong — back to the bottom!';$('#ladFeed').style.color='var(--red)';miss();window.lad.bad()}}
let speedTimer=null;function speedGame(){clearInterval(speedTimer);let left=45,correct=0,total=0,combo=0,current=sample(pool(),1)[0];function render(){app.innerHTML=head('Speed Run','45 seconds. Type the past form and press Enter.')+`<div class="panel speedBox"><div class="timerRing" id="timerRing" style="--deg:360deg"><b id="time">45</b></div><div class="speedPrompt"><div class="combo">COMBO ×<span id="combo">0</span></div><div class="emoji" id="speedEmoji">${icon(current)}</div><h2 id="speedBase" style="font-size:48px;margin:6px 0;text-transform:uppercase">${current[0]}</h2><p id="speedMeaning" class="muted">${current[3]}</p><input id="speedInput" class="answerInput" style="width:min(420px,100%);text-align:center;font-size:22px" placeholder="past simple" autocomplete="off"><div id="speedFeed" class="feedback"></div><p><b id="speedCorrect">0</b> correct • <b id="speedTotal">0</b> attempts</p></div></div>`;let input=$('#speedInput');input.addEventListener('keydown',e=>{if(e.key==='Enter')speedAnswer()});input.focus();speedTimer=setInterval(()=>{left--;$('#time').textContent=left;$('#timerRing').style.setProperty('--deg',(left/45*360)+'deg');if(left<=0){clearInterval(speedTimer);finish()}},1000)}function nextVerb(){current=sample(pool(),1)[0];$('#speedEmoji').textContent=icon(current);$('#speedBase').textContent=current[0];$('#speedMeaning').textContent=current[3];$('#speedInput').value='';$('#speedInput').focus()}function finish(){app.innerHTML=head('Speed Run')+`<div class="panel result"><div style="font-size:72px">⚡</div><div class="score">${correct}</div><h2>correct answers in 45 seconds</h2><p>${total} attempts total</p><button class="btn primary" onclick="speedGame()">Run again</button></div>`}window.speedObj={get current(){return current},incGood(){correct++;combo++;add(5+Math.min(combo,5));$('#speedFeed').textContent='Correct!';$('#speedFeed').style.color='var(--green)'},incBad(){combo=0;miss();$('#speedFeed').textContent='Wrong: '+current[1];$('#speedFeed').style.color='var(--red)'},attempt(){total++;$('#speedCorrect').textContent=correct;$('#speedTotal').textContent=total;$('#combo').textContent=combo},next:nextVerb};render()}function speedAnswer(){let s=window.speedObj,val=$('#speedInput').value.trim().toLowerCase();if(!val)return;if(pastForms(s.current).includes(val))s.incGood();else s.incBad();s.attempt();setTimeout(s.next,260)}
function finalGame(){let round=Array.from({length:15},()=>sample(pool(),1)[0]),i=0,good=0,bad=[];function q(){if(i>=round.length){let pct=Math.round(good/round.length*100),uniq=[...new Set(bad)];app.innerHTML=head('Final Challenge')+`<div class="panel finalBox result"><div style="font-size:72px">${pct>=87?'🏆':pct>=67?'⭐':'📚'}</div><div class="score">${good}/15</div><h2>${pct}% accuracy</h2>${uniq.length?`<p class="muted">Review these verbs:</p><div class="review">${uniq.map(x=>{let v=V[x];return `<div><span>${v[0].toUpperCase()}</span><b>${v[1].toUpperCase()}</b></div>`}).join('')}</div>`:'<p>Perfect round!</p>'}<button class="btn primary" onclick="finalGame()">Try again</button></div>`;return}let v=round[i],type=i%5,ans=primary(v),body='';if(type===0){let opts=shuffle([ans,...sample(V.filter(x=>primary(x)!==ans),3).map(primary)]);body=`<div class="picture"><div><div class="big">${icon(v)}</div><div class="finalBig">${v[0]}</div><span class="muted">${v[3]}</span></div></div><h2>Choose the past simple:</h2>${choiceOptions(opts,ans)}`}else if(type===1){let opts=shuffle([v[0],...sample(V.filter(x=>x[0]!==v[0]),3).map(x=>x[0])]);body=`<p class="muted" style="text-align:center">Which base form matches this past?</p><div class="finalBig">${ans}</div>${choiceOptions(opts,v[0])}`}else if(type===2){body=`<p class="muted" style="text-align:center">Type the past simple of</p><div class="finalBig">${v[0]}</div><p style="text-align:center">${v[3]}</p><div class="row" style="justify-content:center"><input class="answerInput" id="finalInput" autocomplete="off" placeholder="Past form"><button class="btn primary" onclick="finalTyped()">Check</button></div>`}else if(type===3){let part=v[2].split('/')[0].trim(),opts=shuffle([part,...sample(V.filter(x=>x[2].split('/')[0].trim()!==part),3).map(x=>x[2].split('/')[0].trim())]);body=`<p class="muted" style="text-align:center">Choose the past participle of</p><div class="finalBig">${v[0]}</div>${choiceOptions(opts,part)}`;ans=part}else{let opts=shuffle([v[3],...sample(V.filter(x=>x[3]!==v[3]),3).map(x=>x[3])]);body=`<div class="picture"><div><div class="big">${icon(v)}</div><div class="finalBig" style="font-size:40px">${v[0]}</div></div></div><h2>Choose the meaning:</h2>${choiceOptions(opts,v[3],false)}`;ans=v[3]}app.innerHTML=head('Final Challenge',`Question ${i+1} / 15 • ${good} correct`)+`<div class="panel finalBox"><div class="progress"><span style="width:${i/15*100}%"></span></div><div style="height:14px"></div>${body}<div id="feed" class="feedback"></div></div>`;window.qz={v,type,good:()=>good++,bad:()=>bad.push(V.indexOf(v)),next:()=>{i++;q()}};if(type===2)setTimeout(()=>$('#finalInput')?.focus(),40)}q()}function finalTyped(){let v=window.qz.v,val=$('#finalInput').value.trim().toLowerCase(),ok=pastForms(v).includes(val);$('#finalInput').disabled=true;if(ok){window.qz.good();add(12);$('#feed').textContent='Correct!';$('#feed').style.color='var(--green)'}else{window.qz.bad();miss();$('#feed').textContent='Correct answer: '+v[1];$('#feed').style.color='var(--red)'}setTimeout(window.qz.next,850)}$('#score').textContent=state.score;$('#streak').textContent=state.streak;load();
</script>
