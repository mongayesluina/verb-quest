<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6b5cff">
<title>Verb Quest • Past Simple</title>
<link rel="stylesheet" href="v2.css?v=4">
<link rel="stylesheet" href="v2-fixes.css?v=4">
</head>
<body>
<header class="top">
  <button class="brand" onclick="home()"><b>Verb</b> Quest</button>
  <div class="stats">
    <span class="chip mode" id="modeChip">Loading…</span>
    <span class="chip">⭐ <span id="score">0</span></span>
    <span class="chip dark">🔥 <span id="streak">0</span></span>
  </div>
</header>
<main id="app" class="wrap">
  <div class="loading">
    <div class="spin">🎮</div>
    <h2>Loading Verb Quest…</h2>
    <p class="muted">Preparing 200 verbs and 9 games.</p>
  </div>
</main>
<script src="v2-core.js?v=4"></script>
<script src="v2-games.js?v=4"></script>
<script src="v2-fixes.js?v=4"></script>
</body>
</html>
