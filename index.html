<html lang="en">

<style>
:root{--p:#5a54e8;--p2:#8d87ff;--bg:#f5f7fc;--card:#fff;--text:#172033;--muted:#6d778c;--ok:#169c67;--bad:#df5260;--line:#e1e6ef;--dark:#172033;--shadow:0 18px 48px #1c28401c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 10% 0,#ecebff 0,transparent 25%),linear-gradient(180deg,#fafbff,#f3f6fb);color:var(--text);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px max(16px,calc((100vw - 1120px)/2))}.brand{border:0;background:none;font-weight:950;font-size:20px;color:var(--text)}.brand b{color:var(--p)}.stats{display:flex;gap:8px;align-items:center}.chip{background:#f0efff;color:var(--p);padding:8px 11px;border-radius:999px;font-weight:850;font-size:13px}.wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:34px 0 70px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center;padding:34px 0}.hero h1{font-size:clamp(43px,6vw,72px);line-height:1;letter-spacing:-3px;margin:12px 0 18px}.hero h1 span{color:var(--p)}.hero p{color:var(--muted);font-size:18px;line-height:1.65;max-width:680px}.heroVisual{min-height:330px;background:linear-gradient(135deg,var(--p),var(--p2));border-radius:34px;display:grid;place-items:center;box-shadow:0 22px 55px #5a54e82b}.heroCard{width:220px;height:220px;border-radius:32px;background:#fff;display:grid;place-items:center;text-align:center;transform:rotate(4deg);box-shadow:var(--shadow)}.heroCard .e{font-size:90px}.heroCard b{display:block;color:var(--p);font-size:25px}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:900}.primary{background:var(--p);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}.dark{background:var(--dark);color:#fff}.small{padding:9px 12px;font-size:13px}.games{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.game{background:#fff;border:1px solid var(--line);border-radius:21px;padding:20px;text-align:left;min-height:175px;box-shadow:0 9px 25px #1720330d;transition:.2s}.game:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.game.featured{background:linear-gradient(145deg,var(--p),#7771ef);color:#fff}.game .i{font-size:32px}.game h3{margin:22px 0 7px}.game p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.game.featured p{color:#ecebff}.sectionHead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}.back{border:0;background:transparent;color:var(--p);font-weight:900;padding:0}.pageTitle h1,.sectionHead h1{font-size:clamp(33px,4vw,48px);margin:8px 0 10px;letter-spacing:-1.5px}.muted{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:25px;padding:24px;box-shadow:var(--shadow)}.levelGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.level{border:1px solid var(--line);background:#fff;border-radius:22px;padding:22px;text-align:left;min-height:205px}.level.active{border:2px solid var(--p);background:#f4f3ff}.level .num{width:48px;height:48px;border-radius:15px;background:#eeedff;color:var(--p);display:grid;place-items:center;font-weight:950}.level h3{font-size:22px;margin:18px 0 7px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}.toolbar input,.toolbar select,.answerInput{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}.teacherButtons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}.verbGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-height:58vh;overflow:auto;padding-right:4px}.verbItem{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff;display:flex;gap:9px;align-items:flex-start}.verbItem.checked{background:#f1f0ff;border-color:#aaa5ff}.verbItem strong{display:block;text-transform:uppercase;font-size:13px}.verbItem small{display:block;color:var(--muted);margin-top:3px}.flash{display:grid;grid-template-columns:.85fr 1.15fr;gap:24px;align-items:center}.picture{min-height:340px;border-radius:24px;background:linear-gradient(135deg,#ecebff,#fff3dd);display:grid;place-items:center;text-align:center}.picture .big{font-size:115px}.word h2{font-size:58px;margin:4px 0;text-transform:uppercase}.past{font-size:38px;color:var(--p);font-weight:950;text-transform:uppercase}.forms{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.forms div{background:#f7f8fc;padding:12px;border-radius:12px}.quiz{width:min(720px,100%);margin:auto}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.option{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;font-weight:900;text-transform:uppercase}.option.ok{background:#e8f8f1;border-color:#9bdec1;color:var(--ok)}.option.bad{background:#fff0f2;border-color:#f0b3ba;color:var(--bad)}.feedback{min-height:28px;margin-top:13px;font-weight:900}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mem{height:115px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,var(--p),#817bfb);color:#fff;font-weight:950}.mem.open,.mem.done{background:#fff;color:var(--p)}.mem.done{background:#e8f8f1;color:var(--ok);border-color:#9bdec1}.robot{display:grid;grid-template-columns:300px 1fr;gap:22px}.robotBox{background:linear-gradient(145deg,#1d2742,#35415f);color:#fff;border-radius:22px;padding:25px;text-align:center}.robotFace{font-size:120px}.energy{height:12px;background:#ffffff22;border-radius:999px;overflow:hidden}.energy span{display:block;height:100%;background:linear-gradient(90deg,#2ed18a,#b2ea6f);width:100%;transition:.25s}.hangWord{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px 0}.hangLetter{width:42px;height:52px;border-bottom:4px solid var(--text);display:grid;place-items:center;font-size:26px;font-weight:950}.keyboard{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.key{padding:9px 4px;border:1px solid var(--line);border-radius:9px;background:#fff;font-weight:900}.key:disabled{opacity:.55}.matchBoard{display:grid;grid-template-columns:1fr 60px 1fr;gap:16px;align-items:center}.matchCol{display:grid;gap:9px}.matchBtn{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:900;text-transform:uppercase}.matchBtn.sel{background:#eeedff;color:var(--p);border-color:#aaa5ff}.matchBtn.done{background:#e8f8f1;color:var(--ok);border-color:#9bdec1}.drawGrid{display:grid;grid-template-columns:280px 1fr;gap:18px}.drawPrompt{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.drawPrompt h2{font-size:48px;text-transform:uppercase;margin:8px 0}.canvasWrap{background:#fff;border:1px solid var(--line);border-radius:22px;padding:12px}.canvasWrap canvas{width:100%;height:auto;background:#fff;border:2px dashed #d9dee8;border-radius:16px;touch-action:none}.canvasTools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.finalBox{width:min(760px,100%);margin:auto}.finalBig{text-align:center;font-size:54px;font-weight:950;text-transform:uppercase;margin:16px}.result{text-align:center;padding:20px}.result .score{font-size:70px;color:var(--p);font-weight:1000}.review{display:grid;gap:7px;margin:20px auto;max-width:520px}.review div{display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:11px;padding:9px 12px}.loading{text-align:center;padding:100px 20px}.loading .spin{font-size:60px;animation:pulse 1s infinite alternate}@keyframes pulse{to{transform:scale(1.1)}}@media(max-width:900px){.hero{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,1fr)}.levelGrid{grid-template-columns:repeat(2,1fr)}.verbGrid{grid-template-columns:repeat(2,1fr)}.robot,.drawGrid{grid-template-columns:1fr}.flash{grid-template-columns:1fr}.matchBoard{grid-template-columns:1fr}.matchArrow{transform:rotate(90deg);text-align:center}.memory{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.chip.mode{display:none}.games,.levelGrid,.verbGrid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.options{grid-template-columns:1fr}.memory{grid-template-columns:repeat(2,1fr)}.keyboard{grid-template-columns:repeat(7,1fr)}.heroVisual{min-height:250px}.picture{min-height:250px}.picture .big{font-size:85px}.word h2{font-size:44px}.forms{grid-template-columns:1fr}.robotFace{font-size:90px}}
</style>

<body>
<header class="top"><button class="brand" onclick="home()"><b>Verb</b> Quest</button><div class="stats"><span class="chip mode" id="modeChip">Loading…</span><span class="chip">⭐ <span id="score">0</span></span><span class="chip">🔥 <span id="streak">0</span></span></div></header>
<main id="app" class="wrap"><div class="loading"><div class="spin">🎮</div><h2>Loading Verb Quest…</h2><p class="muted">Preparing 200 verbs and all games.</p></div></main>
<script>
let V=[];const app=document.querySelector('#app');const $=s=>document.querySelector(s);const DATA_URL='https://raw.githubusercontent.com/mongayesluina/verb-quest/data-snapshot/index.html';
const saved=(()=>{try{return JSON.parse(localStorage.vqFull||'{}')}catch{return{}}})();let state={score:+(saved.score||0),streak:+(saved.streak||0),level:saved.level??1,mode:saved.mode||'level',custom:Array.isArray(saved.custom)?saved.custom:[],sound:saved.sound!==false};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},sample=(a,n)=>shuffle(a).slice(0,Math.min(n,a.length)),primary=v=>v[1].split('/')[0].trim(),pastForms=v=>v[1].split('/').map(x=>x.trim().toLowerCase());
function save(){localStorage.vqFull=JSON.stringify(state);topbar()}function topbar(){if(!V.length)return;$('#score').textContent=state.score;$('#streak').textContent=state.streak;$('#modeChip').textContent=state.mode==='custom'?`Teacher • ${state.custom.length}`:state.level===0?`All • ${V.length}`:`Level ${state.level} • ${pool().length}`}
function pool(){if(state.mode==='custom'&&state.custom.length>=4){let s=new Set(state.custom);return V.filter((v,i)=>s.has(i))}return state.level===0?V:V.filter(v=>v[4]===state.level)}function add(n){state.score+=n;state.streak++;save()}function miss(){state.streak=0;save()}function speak(t){if(state.sound&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}}function icon(v){return v[6]||'🎯'}function typ(v){return v[5]==='i'?'Irregular':'Regular'}function head(title,sub=''){return `<div class="sectionHead"><div><button class="back" onclick="home()">← Home</button><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div></div>`}
async function load(){try{let t=await fetch(DATA_URL+'?v=1').then(r=>{if(!r.ok)throw Error(r.status);return r.text()});let m=t.match(/const V=(\[[\s\S]*?\]);let score=/);if(!m)throw Error('Verb data not found');V=Function('"use strict";return ('+m[1]+')')();topbar();home()}catch(e){app.innerHTML=`<div class="loading"><div class="spin">⚠️</div><h2>Could not load the verb list</h2><p class="muted">Check your Internet connection and reload the page.</p><button class="btn primary" onclick="location.reload()">Reload</button></div>`}}
function home(){let cards=[['flash','🎴','Flashcards','See base, past, participle and meaning.'],['quiz','🖼️','Guess the Action','Choose the correct past form.'],['memory','🧠','Memory Match','Match base forms with their past.'],['robot','🤖','Save the Robot','Spell the past before energy runs out.'],['matchGame','🔗','Match the Verb','Connect each verb to the correct past.'],['drawGame','🎨','Draw the Action','Draw the action and reveal the past.'],['finalGame','🏆','Final Challenge','Ten mixed questions and a review list.']];app.innerHTML=`<section class="hero"><div><span class="chip">200 VERBS • REGULAR + IRREGULAR</span><h1>Learn the past through <span>games and action.</span></h1><p>Practice common English verbs with images, listening, spelling, memory, matching, drawing and a final challenge.</p><div class="row"><button class="btn primary" onclick="levels()">Choose a level</button><button class="btn secondary" onclick="teacher()">Teacher Mode</button></div></div><div class="heroVisual"><div class="heroCard"><div><div class="e">🏃</div><b>RUN → RAN</b></div></div></div></section><h2>Game zone</h2><section class="games">${cards.map((c,i)=>`<button class="game ${i===6?'featured':''}" onclick="${c[0]}()"><div class="i">${c[1]}</div><h3>${c[2]}</h3><p>${c[3]}</p></button>`).join('')}<button class="game" onclick="teacher()"><div class="i">👨‍🏫</div><h3>Teacher Mode</h3><p>Search, filter and create a custom classroom set.</p></button></section>`;topbar()}
function levels(){let meta=[[1,'Essentials','70 basic and high-frequency verbs.'],[2,'Everyday English','70 useful verbs for conversation and stories.'],[3,'Challenge','60 additional forms and spelling patterns.'],[0,'All 200','Mix every regular and irregular verb.']];app.innerHTML=head('Choose a level','Your choice controls every game.')+`<div class="levelGrid">${meta.map(m=>`<button class="level ${state.mode==='level'&&state.level===m[0]?'active':''}" onclick="setLevel(${m[0]})"><span class="num">${m[0]||'∞'}</span><h3>${m[1]}</h3><p class="muted">${m[2]}</p><b>${m[0]===0?200:V.filter(v=>v[4]===m[0]).length} verbs →</b></button>`).join('')}</div>`}function setLevel(n){state.level=n;state.mode='level';save();home()}
let teacherSet=new Set();function teacher(){teacherSet=new Set(state.mode==='custom'?state.custom:pool().map(v=>V.indexOf(v)));app.innerHTML=head('Teacher Mode','Select at least four verbs. Every game will use the same set.')+`<div class="toolbar"><input id="search" placeholder="Search: go, went, ir..." oninput="teacherList()"><select id="lev" onchange="teacherList()"><option value="0">All levels</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option></select><select id="tp" onchange="teacherList()"><option value="a">All types</option><option value="i">Irregular</option><option value="r">Regular</option></select></div><div class="teacherButtons"><button class="btn secondary small" onclick="pickType('i')">All irregular</button><button class="btn secondary small" onclick="pickType('r')">All regular</button><button class="btn secondary small" onclick="pickAll()">All 200</button><button class="btn secondary small" onclick="teacherSet.clear();teacherList()">Clear</button><button class="btn primary small" onclick="useTeacher()">Use selected (<span id="selCount">0</span>)</button></div><div class="verbGrid" id="verbGrid"></div>`;teacherList()}
function teacherList(){let q=($('#search')?.value||'').toLowerCase(),l=+($('#lev')?.value||0),t=$('#tp')?.value||'a';let out=[];V.forEach((v,i)=>{if((!q||[v[0],v[1],v[2],v[3]].join(' ').toLowerCase().includes(q))&&(!l||v[4]===l)&&(t==='a'||v[5]===t))out.push([v,i])});$('#verbGrid').innerHTML=out.map(([v,i])=>`<label class="verbItem ${teacherSet.has(i)?'checked':''}"><input type="checkbox" ${teacherSet.has(i)?'checked':''} onchange="toggleVerb(${i},this.checked)"><span><strong>${v[0]} → ${v[1]}</strong><small>${v[3]} • ${typ(v)} • L${v[4]}</small></span></label>`).join('');$('#selCount').textContent=teacherSet.size}function toggleVerb(i,on){on?teacherSet.add(i):teacherSet.delete(i);teacherList()}function pickType(t){teacherSet=new Set(V.map((v,i)=>v[5]===t?i:null).filter(i=>i!==null));teacherList()}function pickAll(){teacherSet=new Set(V.map((_,i)=>i));teacherList()}function useTeacher(){if(teacherSet.size<4)return alert('Select at least 4 verbs.');state.custom=[...teacherSet];state.mode='custom';save();home()}
let fi=0;function flash(){let a=pool();fi%=a.length;let v=a[fi];app.innerHTML=head('Flashcards','See it, say it and remember it.')+`<div class="panel flash"><div class="picture"><div><div class="big">${icon(v)}</div><b>${typ(v)} • Level ${v[4]}</b></div></div><div class="word"><div class="muted">BASE FORM</div><h2>${v[0]}</h2><p class="muted">${v[3]}</p><div class="past">${v[1]}</div><div class="forms"><div><small class="muted">PAST PARTICIPLE</small><br><b>${v[2]}</b></div><div><small class="muted">TYPE</small><br><b>${typ(v)}</b></div></div><div class="row"><button class="btn primary" onclick="speak('${primary(v).replace(/'/g,"\\'")}')">🔊 Listen</button><button class="btn secondary" onclick="fi=(fi-1+pool().length)%pool().length;flash()">← Previous</button><button class="btn secondary" onclick="fi=(fi+1)%pool().length;flash()">Next →</button></div></div></div>`}
function quiz(){let a=pool(),round=sample(a,10),i=0,good=0;function q(){if(i>=round.length){app.innerHTML=head('Past Quiz')+`<div class="panel result"><div class="score">${good}/10</div><h2>Round complete</h2><button class="btn primary" onclick="quiz()">Play again</button></div>`;return}let v=round[i],ans=primary(v),opts=shuffle([ans,...sample(V.filter(x=>primary(x)!==ans),3).map(primary)]);app.innerHTML=head('Guess the Action',`Question ${i+1} / ${round.length}`)+`<div class="panel quiz"><div class="picture"><div><div class="big">${icon(v)}</div><h2>${v[0].toUpperCase()}</h2><span class="muted">${v[3]}</span></div></div><h2>Choose the past simple:</h2><div class="options" id="opts">${opts.map(o=>`<button class="option" onclick="answerQuiz(this,'${o.replace(/'/g,"\\'")}','${ans.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div><div id="feed" class="feedback"></div></div>`;window.quizNext=()=>{i++;q()};window.quizGood=()=>good++}q()}function answerQuiz(b,o,a){document.querySelectorAll('.option').forEach(x=>x.disabled=true);if(o===a){b.classList.add('ok');$('#feed').textContent='Correct! +10 XP';$('#feed').style.color='var(--ok)';add(10);window.quizGood();speak(a)}else{b.classList.add('bad');[...document.querySelectorAll('.option')].find(x=>x.textContent===a)?.classList.add('ok');$('#feed').textContent='Correct answer: '+a;$('#feed').style.color='var(--bad)';miss()}setTimeout(window.quizNext,850)}
function memory(){let vs=sample(pool(),6),cards=shuffle(vs.flatMap((v,i)=>[{id:i,t:v[0]},{id:i,t:primary(v)}])),open=[],done=0,moves=0;app.innerHTML=head('Memory Match','Find six base/past pairs.')+`<div class="panel"><div class="row"><span class="chip">Moves <b id="moves">0</b></span><span class="chip">Pairs <b id="pairs">0</b>/6</span></div><div class="memory" style="margin-top:16px">${cards.map(c=>`<button class="mem" data-id="${c.id}" data-t="${c.t}" onclick="memOpen(this)">?</button>`).join('')}</div><div id="memMsg" class="feedback"></div></div>`;window.memState={open,done,moves}}function memOpen(b){let s=window.memState;if(b.classList.contains('open')||b.classList.contains('done')||s.open.length===2)return;b.classList.add('open');b.textContent=b.dataset.t;s.open.push(b);if(s.open.length===2){s.moves++;$('#moves').textContent=s.moves;let[a,c]=s.open;if(a.dataset.id===c.dataset.id){a.classList.add('done');c.classList.add('done');s.done++;$('#pairs').textContent=s.done;add(7);s.open=[];if(s.done===6)$('#memMsg').textContent='Excellent! All pairs matched.'}else setTimeout(()=>{a.classList.remove('open');c.classList.remove('open');a.textContent=c.textContent='?';s.open=[]},650)}}
function robot(){let v=sample(pool(),1)[0],word=primary(v).toUpperCase(),letters=new Set(),errors=0,max=6;app.innerHTML=head('Save the Robot','Spell the past before the battery runs out.')+`<div class="panel robot"><div class="robotBox"><div class="robotFace" id="face">🤖</div><div class="energy"><span id="energy"></span></div><p>ENERGY</p></div><div><p class="muted">Past simple of <b style="color:var(--text);font-size:28px">${v[0].toUpperCase()}</b></p><div class="hangWord" id="hang"></div><div class="keyboard" id="keys"></div><div id="robotMsg" class="feedback"></div><button id="nextRobot" class="btn primary" style="display:none" onclick="robot()">Next verb</button></div></div>`;window.rob={v,word,letters,errors,max};drawRobot();let keys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');$('#keys').innerHTML=keys.map(k=>`<button class="key" onclick="guessLetter(this,'${k}')">${k}</button>`).join('')}function drawRobot(){let s=window.rob;$('#hang').innerHTML=s.word.split('').map(ch=>ch===' '?'<span style="width:20px"></span>':`<span class="hangLetter">${s.letters.has(ch)?ch:''}</span>`).join('');$('#energy').style.width=((s.max-s.errors)/s.max*100)+'%';if([...s.word].filter(ch=>/[A-Z]/.test(ch)).every(ch=>s.letters.has(ch))){$('#robotMsg').textContent=`Saved! ${s.v[0].toUpperCase()} → ${primary(s.v).toUpperCase()}`;$('#robotMsg').style.color='var(--ok)';$('#nextRobot').style.display='inline-block';document.querySelectorAll('.key').forEach(k=>k.disabled=true);add(12);speak(primary(s.v))}else if(s.errors>=s.max){$('#face').textContent='🤖💤';$('#robotMsg').textContent='Answer: '+primary(s.v).toUpperCase();$('#robotMsg').style.color='var(--bad)';$('#nextRobot').style.display='inline-block';document.querySelectorAll('.key').forEach(k=>k.disabled=true);miss()}}function guessLetter(b,l){let s=window.rob;b.disabled=true;s.letters.add(l);if(!s.word.includes(l))s.errors++;drawRobot()}
function matchGame(){let vs=sample(pool(),6),bases=shuffle(vs),pasts=shuffle(vs),a=null,b=null,done=0;app.innerHTML=head('Match the Verb','Choose one card from each side.')+`<div class="panel"><div class="matchBoard"><div class="matchCol" id="baseCol">${bases.map(v=>`<button class="matchBtn" data-id="${V.indexOf(v)}" onclick="matchPick(this,'a')">${v[0]}</button>`).join('')}</div><div class="matchArrow">↔</div><div class="matchCol" id="pastCol">${pasts.map(v=>`<button class="matchBtn" data-id="${V.indexOf(v)}" onclick="matchPick(this,'b')">${primary(v)}</button>`).join('')}</div></div><div id="matchMsg" class="feedback"></div></div>`;window.mat={a,b,done}}function matchPick(el,side){if(el.classList.contains('done'))return;let s=window.mat,root=side==='a'?'#baseCol':'#pastCol';document.querySelectorAll(root+' .sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');s[side]=el;if(s.a&&s.b){if(s.a.dataset.id===s.b.dataset.id){s.a.classList.add('done');s.b.classList.add('done');s.a.classList.remove('sel');s.b.classList.remove('sel');s.done++;$('#matchMsg').textContent=`Correct! ${s.done}/6`;$('#matchMsg').style.color='var(--ok)';add(8);s.a=s.b=null;if(s.done===6)$('#matchMsg').textContent='All six pairs matched!'}else{$('#matchMsg').textContent='Try another pair.';$('#matchMsg').style.color='var(--bad)';setTimeout(()=>{s.a?.classList.remove('sel');s.b?.classList.remove('sel');s.a=s.b=null},450)}}}
function drawGame(){let v=sample(pool(),1)[0];app.innerHTML=head('Draw the Action','Draw with mouse, finger or stylus, then reveal the past.')+`<div class="drawGrid"><div class="drawPrompt"><span class="chip">DRAW THIS</span><h2>${v[0]}</h2><p class="muted">${v[3]}</p><button class="btn primary" onclick="revealDraw()">Reveal past</button><div id="drawAns" style="margin-top:18px"></div></div><div class="canvasWrap"><canvas id="canvas" width="1000" height="620"></canvas><div class="canvasTools"><label>Brush <input id="size" type="range" min="2" max="24" value="6"></label><button class="btn secondary small" onclick="eraser=!eraser">Eraser</button><button class="btn secondary small" onclick="clearCanvas()">Clear</button><button class="btn dark small" onclick="drawGame()">New verb</button></div></div></div>`;window.drawVerb=v;setupCanvas()}let ctx,drawing=false,eraser=false;function setupCanvas(){let c=$('#canvas');ctx=c.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';let pos=e=>{let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};let start=e=>{drawing=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()},move=e=>{if(!drawing)return;let p=pos(e);ctx.strokeStyle=eraser?'#fff':'#20293a';ctx.lineWidth=eraser?35:+$('#size').value;ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()},stop=()=>drawing=false;c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);window.addEventListener('pointerup',stop)}function clearCanvas(){ctx.clearRect(0,0,1000,620)}function revealDraw(){let v=window.drawVerb;$('#drawAns').innerHTML=`<span class="muted">PAST SIMPLE</span><div class="past">${v[1]}</div><p>${v[0].toUpperCase()} → ${v[1].toUpperCase()}</p>`;add(3);speak(primary(v))}
function finalGame(){let round=sample(pool(),10),i=0,good=0,bad=[];function q(){if(i>=round.length){let pct=Math.round(good/round.length*100),uniq=[...new Set(bad)];app.innerHTML=head('Final Challenge')+`<div class="panel finalBox result"><div style="font-size:70px">${pct>=80?'🏆':pct>=60?'⭐':'📚'}</div><div class="score">${good}/10</div><h2>${pct}% accuracy</h2>${uniq.length?`<div class="review">${uniq.map(x=>{let v=V[x];return `<div><span>${v[0].toUpperCase()}</span><b>${v[1].toUpperCase()}</b></div>`}).join('')}</div>`:'<p>Perfect round!</p>'}<button class="btn primary" onclick="finalGame()">Try again</button></div>`;return}let v=round[i],type=i%4,ans=primary(v);let body='';if(type===0||type===3){let opts=shuffle([ans,...sample(V.filter(x=>primary(x)!==ans),3).map(primary)]);body=`<div class="picture"><div><div class="big">${icon(v)}</div><div class="finalBig">${v[0]}</div><span class="muted">${v[3]}</span></div></div><h2>Choose the past simple:</h2><div class="options">${opts.map(o=>`<button class="option" onclick="finalChoice(this,'${o.replace(/'/g,"\\'")}','${ans.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>`}else if(type===1){let opts=shuffle([v[0],...sample(V.filter(x=>x[0]!==v[0]),3).map(x=>x[0])]);body=`<p class="muted" style="text-align:center">Which base form matches this past?</p><div class="finalBig">${ans}</div><div class="options">${opts.map(o=>`<button class="option" onclick="finalChoice(this,'${o.replace(/'/g,"\\'")}','${v[0].replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div>`}else{body=`<p class="muted" style="text-align:center">Type the past simple of</p><div class="finalBig">${v[0]}</div><p style="text-align:center">${v[3]}</p><div class="row" style="justify-content:center"><input class="answerInput" id="finalInput" autocomplete="off" placeholder="Past form"><button class="btn primary" onclick="finalTyped()">Check</button></div>`}app.innerHTML=head('Final Challenge',`Question ${i+1} / ${round.length} • ${good} correct`)+`<div class="panel finalBox">${body}<div id="finalFeed" class="feedback"></div></div>`;window.fin={round,i,good,bad,next:()=>{i++;q()},v,ans,setGood:()=>good++,addBad:()=>bad.push(V.indexOf(v))};if(type===2)setTimeout(()=>$('#finalInput')?.focus(),50)}q()}function finalChoice(b,o,a){document.querySelectorAll('.option').forEach(x=>x.disabled=true);if(o===a){b.classList.add('ok');window.fin.setGood();add(10);$('#finalFeed').textContent='Correct!';$('#finalFeed').style.color='var(--ok)'}else{b.classList.add('bad');[...document.querySelectorAll('.option')].find(x=>x.textContent===a)?.classList.add('ok');window.fin.addBad();miss();$('#finalFeed').textContent='Correct answer: '+a;$('#finalFeed').style.color='var(--bad)'}setTimeout(window.fin.next,800)}function finalTyped(){let val=$('#finalInput').value.trim().toLowerCase(),v=window.fin.v,ok=pastForms(v).includes(val);if(ok){window.fin.setGood();add(10);$('#finalFeed').textContent='Correct!';$('#finalFeed').style.color='var(--ok)'}else{window.fin.addBad();miss();$('#finalFeed').textContent='Correct answer: '+v[1];$('#finalFeed').style.color='var(--bad)'}$('#finalInput').disabled=true;setTimeout(window.fin.next,850)}
$('#score').textContent=state.score;$('#streak').textContent=state.streak;load();
</script>
