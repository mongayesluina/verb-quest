useful English verbs with flashcards, visual questions, memory and a classroom selection mode.</p><div class="row"><button class="btn primary" onclick="flash()">Start flashcards</button><button class="btn secondary" onclick="teacher()">Teacher mode</button></div></div><div class="visual"><div class="emoji">🏃</div></div></section><h2>Game zone</h2><section class="games"><button class="game" onclick="flash()"><div class="i">🎴</div><h3>Flashcards</h3><p>Base, past, participle and meaning.</p></button><button class="game" onclick="quiz()"><div class="i">🎯</div><h3>Past Quiz</h3><p>Choose the correct past form.</p></button><button class="game" onclick="memory()"><div class="i">🧠</div><h3>Memory</h3><p>Match base forms with past forms.</p></button><button class="game" onclick="teacher()"><div class="i">👨‍🏫</div><h3>Teacher Mode</h3><p>Filter and build a custom class set.</p></button></section>`}function head(title){return `<div class="section-head"><div><button class="back" onclick="home()">← Home</button><h1>${title}</h1></div></div>`}function flash(){let a=pool(),v=a[current%a.length];app.innerHTML=head('Flashcards')+`<div class="panel flash"><div class="picture"><div><div class="big">${v[6]}</div><div class="muted">${v[5]=='i'?'IRREGULAR':'REGULAR'} • LEVEL ${v[4]}</div></div></div><div class="word"><div class="muted">BASE FORM</div><h2>${v[0].toUpperCase()}</h2><p class="muted">${v[3]}</p><div class="muted">PAST SIMPLE</div><div class="past">${v[1].toUpperCase()}</div><p><b>Past participle:</b> ${v[2]}</p><div class="row"><button class="btn primary" onclick="speak('${primary(v).replace(/'/g,"\\'")}')">🔊 Listen</button><button class="btn secondary" onclick="current=(current+1)%pool().length;flash()">Next →</button></div></div></div>`}function quiz(){let v=pool()[Math.floor(Math.random()*pool().length)],ans=primary(v),alts=sample(V.filter(x=>primary(x)!=ans),3).map(primary),opts=shuffle([ans,...alts]);app.innerHTML=head('Past Simple Quiz')+`<div class="panel"><div class="picture"><div><div class="big">${v[6]}</div><h2>${v[0].toUpperCase()}</h2><div class="muted">${v[3]}</div></div></div><h2>Choose the past simple:</h2><div class="options" id="opts">${opts.map(o=>`<button class="option" onclick="checkQuiz(this,'${o.replace(/'/g,"\\'")}','${ans.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div><div id="feedback"></div></div>`}function checkQuiz(b,o,a){document.querySelectorAll('.option').forEach(x=>x.disabled=true);if(o==a){b.classList.add('ok');$('#feedback').innerHTML='<p style="color:var(--ok);font-weight:900">Correct! +10 XP</p>';add(10);speak(a)}else{b.classList.add('bad');[...document.querySelectorAll('.option')].find(x=>x.textContent==a)?.classList.add('ok');$('#feedback').innerHTML=`<p style="color:var(--bad);font-weight:900">Answer: ${a}</p>`}setTimeout(quiz,1100)}function teacher(){app.innerHTML=head('Teacher Mode')+`<div class="toolbar"><input id="search" placeholder="Search: go, went, ir..." oninput="renderList()"><select id="lev" onchange="renderList()"><option value="0">All levels</option><option>1</option><option>2</option><option>3</option></select><select id="typ" onchange="renderList()"><option value="a">All types</option><option value="i">Irregular</option><option value="r">Regular</option></select></div><div class="row" style="margin-bottom:14px"><button class="btn secondary" onclick="selectType('i')">Select irregular</button><button class="btn secondary" onclick="selectType('r')">Select regular</button><button class="btn secondary" onclick="document.querySelectorAll('.pick').forEach(x=>x.checked=true)">Select all</button><button class="btn primary" onclick="useSelected()">Use selected verbs</button></div><div id="list" class="verb-grid"></div>`;renderList()}function renderList(){let q=($('#search')?.value||'').toLowerCase(),l=+($('#lev')?.value||0),t=$('#typ')?.value||'a';let rows=V.map((v,i)=>[v,i]).filter(([v])=>(!q||[v[0],v[1],v[3]].join(' ').toLowerCase().includes(q))&&(!l||v[4]==l)&&(t=='a'||v[5]==t));$('#list').innerHTML=rows.map(([v,i])=>`<label class="verb-item"><input class="pick" data-i="${i}" type="checkbox"><strong>${v[0].toUpperCase()} → ${v[1].toUpperCase()}</strong><small>${v[3]} • ${v[5]=='i'?'Irregular':'Regular'} • L${v[4]}</small></label>`).join('')}function selectType(t){document.querySelectorAll('.pick').forEach(c=>c.checked=V[+c.dataset.i][5]==t)}function useSelected(){let ids=[...document.querySelectorAll('.pick:checked')].map(x=>+x.dataset.i);if(ids.length<4){alert('Select at least 4 verbs.');return}custom=ids.map(i=>V[i]);$('#modeChip').textContent=custom.length+' selected';current=0;flash()}function memory(){let vs=sample(pool(),6),cards=shuffle(vs.flatMap((v,i)=>[{id:i,t:v[0]},{id:i,t:primary(v)}])),open=[],done=0;app.innerHTML=head('Memory Match')+`<div class="panel"><p class="muted">Find the base form and past simple pairs.</p><div class="memory" id="mem">${cards.map((c,i)=>`<button class="mem" data-id="${c.id}" data-t="${c.t}" onclick="openMem(this)">?</button>`).join('')}</div><div id="memStatus"></div></div>`;window._open=open;window._done=done}function openMem(b){if(b.classList.contains('open')||b.classList.contains('done')||window._open.length==2)return;b.classList.add('open');b.textContent=b.dataset.t;window._open.push(b);if(window._open.length==2){let[a,c]=window._open;if(a.dataset.id==c.dataset.id){a.classList.add('done');c.classList.add('done');window._done++;add(6);window._open=[];if(window._done==6)$('#memStatus').innerHTML='<p style="color:var(--ok);font-weight:900">Great! All pairs matched.</p>'}else setTimeout(()=>{a.classList.remove('open');c.classList.remove('open');a.textContent=c.textContent='?';window._open=[]},650)}}$('#score').textContent=score;home();</script></body></html>
